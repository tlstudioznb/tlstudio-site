<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0e;
  --panel: #101218;
  --border: rgba(255,255,255,0.10);
  --text: #f2f4f8;
  --text-secondary: #8b93a5;
  --accent: #57e6ff;
  --accent-hover: #7a6bff;
  --success: #34d399;
  --error: #f87171;
  --purple: #7a6bff;
  --pink: #f472b6;
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }

.container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* ========== Navigation ========== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(16,18,24,0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  transition: box-shadow 0.3s;
}
.nav.scrolled { box-shadow: 0 1px 12px rgba(255,255,255,0.07); }
.nav-inner {
  max-width: 1120px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 24px;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1.05rem; color: var(--text);
}
.nav-logo {
  width: 30px; height: 30px; background: var(--accent);
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px;
}
.nav-links { display: flex; gap: 32px; }
.nav-links a {
  font-size: 0.9rem; color: var(--text-secondary);
  transition: color 0.2s; position: relative;
}
.nav-links a:hover { color: var(--accent); }
.nav-hamburger {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; padding: 4px;
}
.nav-hamburger span {
  display: block; width: 22px; height: 2px;
  background: var(--text); border-radius: 1px;
  transition: all 0.3s;
}

/* ========== Hero ========== */
.hero {
  position: relative; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  text-align: center; overflow: hidden;
  background: linear-gradient(170deg, #0a1220 0%, #0a0a0e 40%, #141026 70%, #0a0a0e 100%);
}
#heroCanvas {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
}
.hero-content {
  position: relative; z-index: 1;
  max-width: 760px; padding: 120px 24px 80px;
  opacity: 0; transform: translateY(32px);
  animation: heroFadeIn 1s ease 0.3s forwards;
}
.hero-mask {
  width: 72px; height: 72px; margin: 0 auto 20px;
  filter: drop-shadow(0 4px 12px rgba(87,230,255,0.25));
  animation: maskPulse 3s ease-in-out infinite;
}
@keyframes maskPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes heroFadeIn {
  to { opacity: 1; transform: translateY(0); }
}
.hero-badge {
  display: inline-block;
  padding: 5px 14px; border-radius: 20px;
  background: rgba(87,230,255,0.08); color: var(--accent);
  font-size: 0.8rem; font-weight: 600; margin-bottom: 24px;
}
.hero h1 {
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  font-weight: 800; line-height: 1.2;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  font-size: clamp(1rem, 2.2vw, 1.2rem);
  color: var(--text-secondary); margin-bottom: 40px;
  max-width: 600px; margin-left: auto; margin-right: auto;
}
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 16px 40px; border-radius: 12px;
  background: var(--accent); color: #fff;
  font-size: 1.05rem; font-weight: 600;
  border: none; cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 4px 16px rgba(87,230,255,0.25);
}
.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(87,230,255,0.30);
}
.btn-primary:active { transform: translateY(0); }
.btn-primary svg { width: 18px; height: 18px; }

/* ========== Section Common ========== */
section { padding: 100px 0; }
.section-label {
  display: inline-block; font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--accent); margin-bottom: 12px;
}
.section-title {
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 800; margin-bottom: 16px;
}
.section-desc {
  font-size: 1.05rem; color: var(--text-secondary);
  max-width: 560px; margin: 0 auto 56px;
}
.text-center { text-align: center; }

/* ========== Features ========== */
.features { background: var(--bg); }
.features-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
}
.feature-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 36px 28px;
  text-align: center;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative; overflow: hidden;
}
.feature-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; background: var(--accent);
  transform: scaleX(0); transition: transform 0.35s;
}
.feature-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 32px rgba(255,255,255,0.07);
  border-color: rgba(87,230,255,0.20);
}
.feature-card:hover::before { transform: scaleX(1); }
.feature-icon {
  font-size: 2.6rem; margin-bottom: 18px;
  display: block;
}
.feature-card h3 {
  font-size: 1.1rem; font-weight: 700; margin-bottom: 10px;
}
.feature-card p {
  font-size: 0.88rem; color: var(--text-secondary); line-height: 1.55;
}

/* ========== Highlights ========== */
.highlights { background: var(--panel); }
.highlights-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
  align-items: center;
}
.mockup-frame {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 12px 40px rgba(255,255,255,0.07);
  aspect-ratio: 4/3;
  display: flex; flex-direction: column;
}
.mockup-titlebar {
  height: 36px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; gap: 7px;
}
.mockup-dot {
  width: 10px; height: 10px; border-radius: 50%;
}
.mockup-dot:nth-child(1) { background: var(--error); }
.mockup-dot:nth-child(2) { background: #d29922; }
.mockup-dot:nth-child(3) { background: var(--success); }
.mockup-body {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  padding: 24px;
}
.mockup-body .mock-wave {
  display: flex; align-items: center; gap: 3px;
}
.mockup-body .mock-bar {
  width: 4px; border-radius: 2px; background: var(--accent);
  opacity: 0.35;
}
.mockup-body .mock-label {
  font-size: 0.75rem; color: var(--text-secondary);
}
.mockup-body .mock-btn {
  padding: 8px 24px; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 0.8rem;
  border: none; opacity: 0.6;
}
.highlights-list { list-style: none; display: flex; flex-direction: column; gap: 24px; }
.highlights-list li {
  display: flex; gap: 16px; align-items: flex-start;
}
.hl-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; flex-shrink: 0;
  background: var(--bg); border: 1px solid var(--border);
}
.hl-text h4 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.hl-text p { font-size: 0.88rem; color: var(--text-secondary); }

/* ========== Tech Specs ========== */
.tech-specs { background: var(--bg); }
.tech-tags {
  display: flex; flex-wrap: wrap; gap: 12px;
  justify-content: center; margin-bottom: 48px;
}
.tech-tag {
  padding: 10px 20px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--border);
  font-size: 0.9rem; font-weight: 600;
  transition: all 0.25s;
}
.tech-tag:hover {
  border-color: var(--accent); color: var(--accent);
  transform: translateY(-2px);
}
.tech-tag.accent { border-color: var(--accent); color: var(--accent); background: rgba(87,230,255,0.06); }
.tech-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  max-width: 800px; margin: 0 auto;
}
.tech-item {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; text-align: center;
}
.tech-item h4 { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; }
.tech-item p { font-size: 1.05rem; font-weight: 700; }

/* ========== CTA Bottom ========== */
.cta-bottom {
  background: linear-gradient(170deg, #0a1220 0%, #141026 100%);
  text-align: center; padding: 100px 0;
}
.cta-bottom h2 {
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 800; margin-bottom: 12px;
}
.cta-bottom .cta-desc {
  font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 36px;
}
.badge-row {
  display: flex; gap: 10px; justify-content: center; margin-top: 20px;
}
.badge {
  padding: 4px 12px; border-radius: 6px;
  font-size: 0.75rem; font-weight: 600;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text-secondary);
}

/* ========== Download Modal ========== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s cubic-bezier(0.22,1,0.36,1);
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-dialog {
  background: rgba(16,18,24,0.8);
  border-radius: 28px;
  padding: 40px 32px 32px;
  max-width: 500px; width: 90%;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.08),
    0 2px 8px rgba(0,0,0,0.04),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 -1px 0 rgba(0,0,0,0.04);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.08);
  position: relative;
  transform: translateY(30px) scale(0.96);
  transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
}
.modal-overlay.active .modal-dialog { transform: translateY(0) scale(1); }
.modal-close {
  position: absolute; top: 14px; right: 18px;
  width: 32px; height: 32px; border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-size: 1.15rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); transition: all 0.25s;
}
.modal-close:hover { background: rgba(0,0,0,0.12); color: var(--text); transform: scale(1.08); }
.modal-title {
  font-size: 1.35rem; font-weight: 800; text-align: center;
  margin-bottom: 4px; letter-spacing: -0.3px;
}
.modal-subtitle {
  font-size: 0.85rem; color: var(--text-secondary);
  text-align: center; margin-bottom: 28px;
}
.download-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.download-option {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer; text-decoration: none; color: inherit;
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
}
.download-option:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(87,230,255,0.15);
  box-shadow: 0 4px 16px rgba(255,255,255,0.07);
  transform: translateY(-2px);
}
.download-option .dl-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; font-weight: 800;
  color: #fff; flex-shrink: 0;
}
.download-option .dl-info { flex: 1; }
.download-option .dl-name { font-weight: 700; font-size: 0.95rem; }
.download-option .dl-code { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
.download-option .dl-icon svg { width: 22px; height: 22px; }
.download-option .dl-arrow { color: var(--text-secondary); font-size: 0.9rem; }

/* ========== Footer ========== */
.footer {
  padding: 40px 0; text-align: center;
  border-top: 1px solid var(--border);
}
.footer p { font-size: 0.85rem; color: var(--text-secondary); }
.footer-links { display: flex; gap: 24px; justify-content: center; margin-top: 12px; }
.footer-links a { font-size: 0.82rem; color: var(--text-secondary); transition: color 0.2s; }
.footer-links a:hover { color: var(--accent); }

/* ========== Scroll Animations ========== */
.reveal {
  opacity: 0; transform: translateY(30px);
  transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ========== Responsive ========== */
@media (max-width: 900px) {
  .features-grid { grid-template-columns: repeat(2, 1fr); }
  .highlights-row { grid-template-columns: 1fr; gap: 40px; }
  .tech-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .nav-links { display: none; }
  .nav-links.open {
    display: flex; flex-direction: column;
    position: absolute; top: 56px; left: 0; right: 0;
    background: rgba(10,10,14,0.96);
    backdrop-filter: blur(16px);
    padding: 16px 24px; gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  .nav-hamburger { display: flex; }
  .features-grid { grid-template-columns: 1fr; }
  .tech-grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 2rem; }
  section { padding: 64px 0; }
}
</style>
</head>

/* ========== Hero Canvas Particle Animation ========== */
(function() {
  const canvas = document.getElementById('heroCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const PARTICLE_COUNT = 60;
  const COLORS = ['rgba(87,230,255,0.18)', 'rgba(122,107,255,0.12)', 'rgba(244,114,182,0.10)', 'rgba(46,160,67,0.10)'];

  function resize() {
    W = canvas.width = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
  }

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.r = Math.random() * 2.5 + 0.8;
      this.vx = (Math.random() - 0.5) * 0.35;
      this.vy = (Math.random() - 0.5) * 0.35;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.opacity = Math.random() * 0.5 + 0.3;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fill();
    }
  }

  function init() {
    resize();
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
  }

  function drawLines() {
    ctx.globalAlpha = 0.04;
    ctx.strokeStyle = '#57e6ff';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 140) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    particles.forEach(p => { p.update(); p.draw(); });
    drawLines();
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  loop();
})();
</script>
