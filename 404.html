<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 这一页不在 · TL STUDIO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<style>
:root{--l0:#fff;--l1:#fcfcfc;--ink:#171717;--ink-2:#555;--ink-3:#8a8a8a;--ink-4:#b5b5b5;--line:rgba(23,23,23,.075);--line-2:rgba(23,23,23,.14)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--l0);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:960px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
header{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid var(--line)}
.brand{font-size:15px;font-weight:500;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand span{color:var(--ink-4);margin:0 1px}
header a.back{font-size:13px;color:var(--ink-3);text-decoration:none}
header a.back:hover{color:var(--ink)}
main{padding:clamp(80px,14vh,150px) 0 clamp(60px,10vh,110px)}
.code{font-size:12px;letter-spacing:.18em;color:var(--ink-4);text-transform:uppercase}
h1{font-size:clamp(2rem,5.4vw,3.4rem);font-weight:420;letter-spacing:-.03em;line-height:1.15;margin:18px 0 0}
p.lede{margin:18px 0 0;font-size:15px;line-height:1.9;color:var(--ink-2);max-width:46ch;text-wrap:pretty}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.links a{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:999px;border:1px solid var(--line-2);background:var(--l0);color:var(--ink);text-decoration:none;font-size:13.5px;transition:background .3s,border-color .3s,transform .4s}
.links a:hover{background:var(--l1);border-color:rgba(23,23,23,.22);transform:translateY(-1px)}
.links a.primary{border-color:rgba(23,23,23,.28);font-weight:500}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:12.5px;color:var(--ink-4)}
footer a{color:var(--ink-3);text-decoration:none;margin-left:14px}
footer a:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.links a,.links a:hover{transform:none}}
</style>
</head>
<body>
<header><div class="shell" style="display:flex;align-items:center;justify-content:space-between;width:100%;height:64px">
  <a class="brand" href="/">TL<span>/</span>STUDIO</a>
  <a class="back" href="/">回首页</a>
</div></header>
<main><div class="shell">
  <p class="code">Error 404</p>
  <h1>这一页不在。</h1>
  <p class="lede">可能是链接过期，也可能是我们改过地址。整个站现在都在首页这一个文件里，回去找找就行。</p>
  <div class="links">
    <a class="primary" href="/">回首页</a>
    <a href="/#software">看十三个工具</a>
    <a href="/#/sponsor">赞助工作室</a>
  </div>
</div></main>
<footer><div class="shell">
  © 2026 TL 工作室 · 免费也能用，好用才付费
  <a href="https://tlbs.top" target="_blank" rel="noopener">tlbs.top</a>
</div></footer>
</body>
</html>
